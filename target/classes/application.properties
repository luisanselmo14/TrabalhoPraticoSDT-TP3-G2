# ==============================
# 🔧 SERVER CONFIGURATION
# ==============================
# Define a porta onde a API vai correr
server.port=8081

# Contexto base da aplicação (opcional, muda a rota base da API)
server.servlet.context-path=/api

# Permite encoding UTF-8 em todas as respostas
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# ==============================
# 🌐 IPFS CONFIGURATION
# ==============================
# URL do daemon IPFS local
ipfs.host=127.0.0.1
ipfs.port=5001
ipfs.protocol=http

# ==============================
# 🗄️ DATABASE (MongoDB)
# ==============================
# Exemplo de configuração local do MongoDB
spring.data.mongodb.uri=mongodb://localhost:27017/sdt_db
spring.data.mongodb.database=sdt_db

# ==============================
# 🪵 LOGGING
# ==============================
# Define o nível de logs (INFO é limpo, DEBUG é detalhado)
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.com.sdt=DEBUG

# Define o formato e ficheiro de saída dos logs (opcional)
logging.file.name=logs/sdt-app.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n

# ==============================
# ⚙️ SPRING BOOT GENERAL
# ==============================
spring.main.banner-mode=console
spring.application.name=sdt-api

# ==============================
# 🚀 CORS (se tiver frontend separado)
# ==============================
# Permitir chamadas externas, por exemplo, do Angular
# spring.web.cors.allowed-origins=http://localhost:4200
# spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
# spring.web.cors.allowed-headers=*

# ==============================
# 💓 HEARTBEAT & FAILURE DETECTION
# ==============================
# Intervalo entre heartbeats enviados pelo líder (em segundos)
heartbeat.interval.seconds=5

# Timeout para detecção de falha do líder pelos peers (em segundos)
# Deve ser maior que heartbeat.interval.seconds (recomendado: 3x o intervalo)
heartbeat.timeout.seconds=15

# Número total de peers no cluster (para cálculo de maioria no 2PC)
cluster.peers=3
